name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支时自动构建并部署
  push:
    branches: ["main"]
  # 允许在 Actions 标签页手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需权限（无需手动填密钥）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: 构建生产包
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
